# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_locale: en

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Extend Articles with custom fields
    App\Content\DataMapper\ArticleCustomFieldsDataMapper:
        tags:
            - { name: 'sulu_content.data_mapper', priority: 64 }

    App\Content\Normalizer\ArticleCustomFieldsNormalizer:
        tags:
            - { name: 'sulu_content.normalizer', priority: 20 }

    App\Content\Merger\ArticleCustomFieldsMerger:
        tags:
            - { name: 'sulu_content.merger', priority: 20 }

    # Workaround: Override sulu_article.article_route_defaults_provider to fix Sulu bug in
    # ContentRouteDefaultsProvider which hardcodes Article::class (a MappedSuperclass) instead
    # of using the configured sulu.model.article.class parameter.
    App\Route\ArticleRouteDefaultsProvider:
        arguments:
            $metadataProviderRegistry: '@sulu_admin.metadata_provider_registry'
            $cacheLifetimeResolver: '@sulu_http_cache.cache_lifetime.resolver'
            $webspaceManager: '@sulu_core.webspace.webspace_manager'
            $environment: '%kernel.environment%'
            $articleEntityClass: '%sulu.model.article.class%'
        tags:
            - { name: sulu_route.route_defaults_provider, resource_key: articles }

    sulu_article.article_route_defaults_provider:
        alias: App\Route\ArticleRouteDefaultsProvider
        public: true

    # Admin: Article Additional Tab
    App\Admin\ArticleAdditionalAdmin:
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }